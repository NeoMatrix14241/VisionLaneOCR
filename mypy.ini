[mypy]
python_version = 3.12
files = core, gui, utils, data, main.py, run_ocr.py, verify_models.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = False
no_implicit_optional = True
# Third-party packages without type information (torch/doctr/PyQt6 ship their own or are optional)
ignore_missing_imports = True

[mypy-tests.*]
ignore_errors = True
