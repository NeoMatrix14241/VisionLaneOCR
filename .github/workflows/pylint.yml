name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest        # the application targets Windows
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (CPU PyTorch is enough for the tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Pylint (fails the build below 9.0)
        run: pylint --rcfile=.pylintrc core gui utils data main.py run_ocr.py verify_models.py --fail-under=9.0
